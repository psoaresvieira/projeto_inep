name: Gerar PDF executivo do Projeto INEP

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/gerar_overview_pdf.py"
      - ".github/workflows/overview-pdf.yml"

permissions:
  contents: write

jobs:
  renderizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar biblioteca de PDF e verificador
        run: python -m pip install "reportlab>=4,<5" "pypdf>=5,<7"
      - name: Validar script
        run: python -m py_compile scripts/gerar_overview_pdf.py
      - name: Gerar relatorio profissional em PDF
        run: python scripts/gerar_overview_pdf.py
      - name: Conferir estrutura e conteúdo do PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          arq=Path("reports/overview_executivo_projeto_inep.pdf")
          if not arq.is_file() or arq.stat().st_size<15000:
              raise SystemExit("PDF não gerado corretamente.")
          pdf=PdfReader(str(arq))
          if len(pdf.pages)!=5:
              raise SystemExit(f"Esperadas 5 páginas; obtidas {len(pdf.pages)}.")
          texto="\n".join(p.extract_text() or "" for p in pdf.pages)
          obrigatorias=["PROJETO INEP","116.779","482","223","456","IDEB 2025",
                        "Painel executivo geral","Visão territorial","PLANO DE CONTINUIDADE"]
          ausentes=[item for item in obrigatorias if item not in texto]
          if ausentes:
              raise SystemExit("Conteúdo ausente: " + repr(ausentes))
          for i,page in enumerate(pdf.pages,1):
              n=len(page.extract_text() or "")
              print(f"Página {i}: {n} caracteres")
              if n<400:
                  raise SystemExit(f"Texto insuficiente na página {i}")
          print("PDF verificado, páginas:",len(pdf.pages),"bytes:",arq.stat().st_size)
          PY
      - name: Publicar PDF no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/overview_executivo_projeto_inep.pdf
          if git diff --cached --quiet; then
            echo "PDF já estava atualizado"
          else
            git commit -m "docs: publica overview executivo PDF do Projeto INEP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Disponibilizar PDF como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-executivo-projeto-inep
          path: reports/overview_executivo_projeto_inep.pdf
          retention-days: 30
