name: Inspecionar pacotes oficiais do INEP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspecao-inep.yml"

permissions:
  contents: write

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar sintaxe dos scripts
        run: python -m py_compile src/00_baixar_bases.py src/01_inspecao.py src/01_perfil_paraiba.py
      - name: Baixar os 3 ZIPs oficiais (sem publicar dados brutos)
        env:
          INEP_PERMITIR_TLS_NAO_VERIFICADO: "1"
        run: |
          python -u src/00_baixar_bases.py
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path("reports/inspecao/downloads.json").read_text(encoding="utf-8"))
          falhas = [x["nome"] for x in j["downloads"] if x["status"] != "baixado"]
          if falhas:
              raise SystemExit("Downloads falharam: " + ", ".join(falhas))
          PY
      - name: Inventariar conteúdo e cabeçalhos dos pacotes
        run: |
          python -u src/01_inspecao.py --pasta dados_brutos
          test -f reports/inspecao/inventario.md
      - name: Contar registros e avaliar chaves na Paraíba
        run: |
          python -u src/01_perfil_paraiba.py
          test -f reports/inspecao/perfil_paraiba.md
      - name: Publicar relatórios agregados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/inspecao/inventario.md reports/inspecao/perfil_paraiba.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos relatórios"
          else
            git commit -m "docs: atualiza inventário e perfil agregado da Paraíba"
            git push
          fi
      - name: Guardar artefatos para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfil-inep-paraiba
          path: |
            reports/inspecao/inventario.md
            reports/inspecao/inventario.json
            reports/inspecao/downloads.json
            reports/inspecao/perfil_paraiba.md
            reports/inspecao/perfil_paraiba.json
          retention-days: 7
