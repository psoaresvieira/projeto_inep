name: Inspecionar pacotes oficiais do INEP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspecao-inep.yml"

permissions:
  contents: write

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Baixar os 3 ZIPs oficiais (nao publica dados brutos)
        env:
          INEP_PERMITIR_TLS_NAO_VERIFICADO: "1"
        run: python -u src/00_baixar_bases.py
      - name: Inspecionar pacotes baixados
        run: |
          python -u src/01_inspecao.py --pasta dados_brutos
          test -f reports/inspecao/inventario.md
      - name: Publicar relatorio de inventario no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/inspecao/inventario.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no inventario"
          else
            git commit -m "docs: publica inventario dos ZIPs oficiais inspecionados"
            git push
          fi
      - name: Publicar logs de execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-inspecao-inep
          path: |
            reports/inspecao/inventario.md
            reports/inspecao/inventario.json
            reports/inspecao/downloads.json
          retention-days: 7
