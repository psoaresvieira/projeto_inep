name: Gerar PDF profissional — documentação final revisada

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/documentacao-pdf.yml"
      - "scripts/gerar_documentacao_pdf.py"
      - "docs/documentacao_projeto_final_revisada.md"

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências para PDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install "markdown>=3.6,<4" "weasyprint>=62,<69" "pypdf>=5,<8"
      - name: Gerar PDF em A4 e validar páginas
        run: python scripts/gerar_documentacao_pdf.py
      - name: Publicar PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/documentacao_projeto_final_revisada.pdf
          if git diff --cached --quiet; then
            echo "PDF já está atualizado."
          else
            git commit -m "docs: publica PDF profissional da documentação revisada"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Arquivar PDF para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentacao-projeto-inep-final-revisada
          path: reports/documentacao_projeto_final_revisada.pdf
          retention-days: 30
