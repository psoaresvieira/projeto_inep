name: Indicadores municipais e dashboard territorial da Paraíba

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dashboard-municipios.yml"

permissions:
  contents: write

jobs:
  municipios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Conferir sintaxe e testes sintéticos
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Baixar os pacotes oficiais Censo 2024 e IDEB 2025
        env:
          INEP_PERMITIR_TLS_NAO_VERIFICADO: "1"
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path
          m=runpy.run_path("src/00_baixar_bases.py",run_name="modulo_download")
          Path("dados_brutos").mkdir(exist_ok=True)
          for nome in ("microdados_censo_escolar_2024.zip","divulgacao_ensino_medio_escolas_2025.zip"):
              origem=next(x for x in m["ORIGENS"] if x[0]==nome)
              result=m["baixar"](*origem)
              if result["status"]!="baixado" or result["tamanho_coincide_com_anexo"] is not True:
                  raise SystemExit("Falha na obtenção de "+nome)
              print("Obtido:",nome,flush=True)
          PY
      - name: Verificar hash dos CSVs e planilhas dentro dos ZIPs
        run: |
          python - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          fontes=[
              ("microdados_censo_escolar_2024.zip",
               "dados/microdados_ed_basica_2024.csv","md5_microdados_ed_basica_2024.txt"),
              ("divulgacao_ensino_medio_escolas_2025.zip",
               "divulgacao_ensino_medio_escolas_2025.xlsx",
               "md5_divulgacao_ensino_medio_escolas_2025.txt"),
          ]
          for zname,endswith,md5path in fontes:
              with zipfile.ZipFile(Path("dados_brutos")/zname) as z:
                  files=[x for x in z.namelist() if x.endswith(endswith)]
                  checks=[x for x in z.namelist() if x.endswith(md5path)]
                  if len(files)!=1 or len(checks)!=1:
                      raise SystemExit("Conteúdo esperado não encontrado: "+zname)
                  expected=re.search(r"[a-fA-F0-9]{32}",z.read(checks[0]).decode("latin-1"))
                  if not expected:
                      raise SystemExit("Hash de referência não encontrado")
                  md5=hashlib.md5()
                  with z.open(files[0]) as stream:
                      for chunk in iter(lambda:stream.read(1024*1024),b""):
                          md5.update(chunk)
                  if md5.hexdigest().lower()!=expected.group(0).lower():
                      raise SystemExit("Checksum MD5 divergente: "+zname)
                  print("Hash conferido:",zname)
          PY
      - name: Agregar dados por município e validar totais
        run: python -u src/05_indicadores_municipais.py
      - name: Gerar dashboard territorial interativo
        run: python -u src/06_dashboard_municipios.py
      - name: Verificar resultado sem dados identificáveis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          arq=Path("reports/municipios/municipios_agregados.json")
          a=json.loads(arq.read_text(encoding="utf-8"))
          assert a["totais"]["escolas_censo_2024"]==482
          assert a["totais"]["escolas_ideb_2025"]==478
          assert a["totais"]["notas_validas_ideb_2025"]==458
          assert len(a["municipios"])==a["totais"]["municipios"]
          assert len(a["municipios"])>=223
          for item in a["municipios"]:
              assert set(item)=={"codigo_municipio","nome_municipio","censo_2024","ideb_2025"}
          html=Path("dashboard/municipios.html").read_text(encoding="utf-8")
          assert "dados-municipios" in html and "João Pessoa" in html
          assert "__DATA__" not in html
          print("Verificados",len(a["municipios"]),"municípios no painel.")
          PY
      - name: Publicar somente dados agregados e HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            reports/municipios/municipios_agregados.json \
            reports/municipios/resumo_municipios.md \
            dashboard/municipios.html
          if git diff --cached --quiet; then
            echo "Nenhuma atualização necessária"
          else
            git commit -m "data: publica indicadores municipais e dashboard territorial"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Arquivar relatórios agregados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicadores-municipais-pb
          path: |
            reports/municipios/municipios_agregados.json
            reports/municipios/resumo_municipios.md
            dashboard/municipios.html
          retention-days: 7
