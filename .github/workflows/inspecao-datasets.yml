name: Inspecao dos microdados INEP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspecao-datasets.yml"

permissions:
  contents: write

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Baixar bases oficiais (apenas durante a execucao)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dados_brutos
          curl --fail --location --retry 3 --connect-timeout 30 -o dados_brutos/microdados_enem_2024.zip "https://download.inep.gov.br/microdados/microdados_enem_2024.zip"
          curl --fail --location --retry 3 --connect-timeout 30 -o dados_brutos/microdados_censo_escolar_2024.zip "https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2024.zip"
          curl --fail --location --retry 3 --connect-timeout 30 -o dados_brutos/divulgacao_ensino_medio_escolas_2025.zip "https://download.inep.gov.br/ideb/resultados/divulgacao_ensino_medio_escolas_2025.zip"
      - name: Inventariar sem extrair as bases completas
        run: python src/01_inspecao.py --pasta dados_brutos
      - name: Publicar relatorio textual de inspeção
        shell: bash
        run: |
          set -euo pipefail
          cp reports/inspecao/inventario.md docs/inventario_executado.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/inventario_executado.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: registra inventario executado dos pacotes INEP"
            git push
          fi
      - name: Guardar inventario como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-inep
          path: reports/inspecao/
          if-no-files-found: ignore
